{% extends 'base.html' %}
{% block title %}Calmora Login{% endblock %}
{% block content %}
  <div class="card" style="max-width: 520px; margin: 0 auto;">
    <span class="pill">Welcome back</span>
    <h1>Log in to Calmora</h1>
    <p class="muted">Pick up where you left off with a calm, supportive routine.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="dev-token">
      <input type="text" name="identifier" placeholder="Username or email" required>
      <input type="password" name="password" placeholder="Password" required>
      <label><input type="checkbox" name="remember"> Remember me</label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted"><a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
{% endblock %}
